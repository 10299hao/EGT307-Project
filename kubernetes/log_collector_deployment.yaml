apiVersion: apps/v1
kind: Deployment

metadata:
  name: log-collector

spec:
  replicas: 1

  selector:
    matchLabels:
      app: log-collector

  template:
    metadata:
      labels:
        app: log-collector

    spec:
      containers:
        - name: log-collector
          image: weijiee/log_collector:latest

          imagePullPolicy: IfNotPresent

          env:
            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            - name: REPLAY_SPEED
              value: "0.01"

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

---

apiVersion: v1
kind: Service

metadata:
  name: log-collector

spec:
  selector:
    app: log-collector

  ports:
    - port: 8080
      targetPort: 8080

  type: ClusterIP